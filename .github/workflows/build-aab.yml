name: Build AAB Artifact
on:
  push:
    branches: [main, "integration/*"]
  pull_request:
jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Android project
        id: check_android
        run: |
          if [ -f "android/gradlew" ]; then echo "has_android=true" >> $GITHUB_OUTPUT; else echo "has_android=false" >> $GITHUB_OUTPUT; fi
      - name: Build AAB (Android)
        if: steps.check_android.outputs.has_android == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Create placeholder AAB
        if: steps.check_android.outputs.has_android == 'false'
        run: |
          mkdir -p build
          echo "placeholder-aab-no-android-project" > build/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            build/*.aab
          if-no-files-found: warn
