name: FEL Pre-Build CI Check
on:
  push:
    branches: [setup-healthkit]
  pull_request:
    branches: [setup-healthkit, main]

jobs:
  identifier-alignment:
    name: NEXUS Registry + Descriptor Alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate NEXUS mode and runtime contracts
        run: |
          python3 scripts/validate_mode_registry.py
          python3 scripts/validate_ios_runtime_launches.py

      - name: Verify Critical Files
        run: |
          echo "Checking critical deployment files..."
          test -f ./infra/fix_ios_descriptor_path.sh && echo "✓ fix_ios_descriptor_path.sh" || echo "✗ MISSING"
          test -f ./infra/fel_prebuild_ci_check.sh && echo "✓ fel_prebuild_ci_check.sh" || echo "✗ MISSING"
          test -f ./scripts/build-nexus-ios.sh && echo "✓ build-nexus-ios.sh" || echo "✗ MISSING"
          test -f ./infra/native_ios/FELNativeSwiftBridge.swift && echo "✓ FELNativeSwiftBridge.swift" || echo "✗ MISSING"

      - name: Validate iOS descriptors and cooked payload
        run: |
          python3 scripts/validate_ios_descriptor.py
          python3 scripts/validate_cooked_payload.py

      - name: Block Merge on Failure
        if: failure()
        run: |
          echo "::error::Pre-build CI check FAILED. NEXUS registry or descriptor alignment is broken."
          echo "::error::Run the validation scripts locally and fix reported drift."
          exit 1
