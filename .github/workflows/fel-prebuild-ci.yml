name: FEL Pre-Build CI Check
on:
  push:
    branches: [setup-healthkit]
  pull_request:
    branches: [setup-healthkit, main]

jobs:
  identifier-alignment:
    name: 6-Point Identifier Alignment
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Pre-Build CI Check
        run: |
          chmod +x ./infra/fel_prebuild_ci_check.sh
          # Set UPROJECT to the known location in the repo
          export UPROJECT="./UnrealStarter/BasketballGame/FinalEvolutionLab.uproject"
          ./infra/fel_prebuild_ci_check.sh --strict
        env:
          INTERNAL_ID: FinalEvolutionLab
          BUNDLE_ID: com.finalevolutionlab.sovereign

      - name: Verify Critical Files
        run: |
          echo "Checking critical deployment files..."
          test -f ./infra/fix_ios_descriptor_path.sh && echo "✓ fix_ios_descriptor_path.sh" || echo "✗ MISSING"
          test -f ./infra/fel_prebuild_ci_check.sh && echo "✓ fel_prebuild_ci_check.sh" || echo "✗ MISSING"
          test -f ./fel_ue5_ios_shipping_package.sh && echo "✓ fel_ue5_ios_shipping_package.sh" || echo "✗ MISSING"
          test -f ./infra/native_ios/FELNativeSwiftBridge.swift && echo "✓ FELNativeSwiftBridge.swift" || echo "✗ MISSING"

      - name: Validate Mode Registry
        run: |
          python3 -c "
          import json
          with open('./backend/FEL_ModeManager.production.json') as f:
              d = json.load(f)
          registry = d['mode_manager']['mode_registry']
          runtime_modes = [
              'basketball_h2h', 'basketball_dunk', 'basketball_3v3', 'court_carnival',
              'karate_h2h', 'karate_endless',
              'baseball', 'football', 'soccer', 'golf', 'tennis', 'volleyball',
              'gymnastics', 'surfing', 'skateboarding', 'snowboarding',
              'brain_brawl', 'who_scene_it',
          ]
          print(f'Mode registry: {len(registry)} entries')
          prod = [mode for mode in runtime_modes if registry.get(mode, {}).get('status') == 'production']
          print(f'Runtime production: {len(prod)} / {len(runtime_modes)}')
          assert len(prod) == len(runtime_modes), 'Expected all NEXUS runtime modes to be production'
          assert registry.get('market_browse', {}).get('status') == 'non-game-module', 'market_browse must remain non-game-module'
          assert registry.get('movement_lab', {}).get('status') == 'preview', 'movement_lab must remain preview'
          print('✓ Mode registry valid')
          "

      - name: Block Merge on Failure
        if: failure()
        run: |
          echo "::error::Pre-build CI check FAILED. Identifier alignment broken."
          echo "::error::Run ./infra/fix_ios_descriptor_path.sh to resolve."
          exit 1
