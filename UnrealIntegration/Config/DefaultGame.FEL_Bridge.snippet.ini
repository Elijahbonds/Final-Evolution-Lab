; ------------------------------------------------------------------------------
; FELBridge — merge this block into your UE project Config/DefaultGame.ini
; (or run ./prepare_fel_bridge.sh against your project directory).
;
; Runtime: UFELBridgeSubsystem reads [FELBridge] on startup.
; Override URL without editing disk: export FEL_GAME_WS_URL="wss://host/ws/vault"
; ------------------------------------------------------------------------------

[FELBackend]
; HTTP API base (no trailing slash). Session receipt = ApiBaseUrl + SessionReceiptPath unless SessionReceiptUrl is set.
ApiBaseUrl=https://finalevolutiongroup.com
SessionReceiptPath=/api/games/session
; Optional full override (wins over ApiBaseUrl + SessionReceiptPath):
; SessionReceiptUrl=https://finalevolutiongroup.com/api/games/session
; HUD overlay relay (UFELHudRelaySubsystem / BPFL_HUDManager):
HudWebSocketUrl=ws://127.0.0.1:8787/ws/hud
HudUserId=anonymous

[FELBridge]
; Full WebSocket URL including path (not host-only). Phase 1 vault channel:
;   ws://127.0.0.1:8787/ws/vault
; Legacy sovereign hub (type-based envelopes):
;   ws://127.0.0.1:8080/ws/vault
GameWebSocketUrl=ws://127.0.0.1:8787/ws/vault

; After connect, emit JSON focus_keepalive at this interval (seconds). Set false for headless / no iframe focus.
bFocusKeepalive=false
KeepaliveInterval=0.5

; After disconnect or connection error, retry Connect() on a timer (while CachedWsUrl is set).
bAutoReconnect=true
ReconnectDelaySeconds=3
; 0 = unlimited reconnect tries; otherwise stop after N failed reconnect cycles (counter resets on successful OnConnected).
MaxReconnectAttempts=0
