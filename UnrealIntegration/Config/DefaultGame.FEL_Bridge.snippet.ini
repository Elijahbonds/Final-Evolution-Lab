; ------------------------------------------------------------------------------
; FELBridge — merge this block into your UE project Config/DefaultGame.ini
; (or run ./prepare_fel_bridge.sh against your project directory).
;
; Runtime: UFELBridgeSubsystem reads [FELBridge] on startup.
; Override URL without editing disk: export FEL_GAME_WS_URL="wss://host/ws/game/roomId"
; ------------------------------------------------------------------------------

[FELBridge]
; Full WebSocket URL including path (not host-only). Examples:
;   ws://127.0.0.1:8080/ws/game/dev-room
;   wss://your-tunnel.example.com/ws/game/prod-room
GameWebSocketUrl=

; After connect, emit JSON focus_keepalive at this interval (seconds). Set false for headless / no iframe focus.
bFocusKeepalive=false
KeepaliveInterval=0.5

; After disconnect or connection error, retry Connect() on a timer (while CachedWsUrl is set).
bAutoReconnect=true
ReconnectDelaySeconds=3
; 0 = unlimited reconnect tries; otherwise stop after N failed reconnect cycles (counter resets on successful OnConnected).
MaxReconnectAttempts=0
