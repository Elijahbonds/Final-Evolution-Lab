; Merge into Config/DefaultEngine.ini (engine / renderer defaults).
; Gold Master packaging targets live in CONFIG_DefaultGame_FEL.ini → [/Script/UnrealEd.ProjectPackagingSettings] (+TargetPlatforms=IOS|Mac|PS5|Android).
;
; Universal Launch — texture / video format hints for multi-platform cook (merge; validate keys against your exact UE minor).
; Android: ETC2 / Vulkan path pairs with `UFELPlatformManager::ApplyAndroid` (r.Android.Vulkan=1).
; PS5: GNM high-quality path uses BC7 stamps from fel_luma_venue_texture_presave.py (ps5 platform).
[/Script/Engine.RendererSettings]
+TargetedVideoFormats=Android
+TargetedVideoFormats=PS5

; --- Pixel Streaming (merge when Pixel Streaming plugin is enabled) ---
; Showcase: 1080p render + 60 fps cap for WebRTC encode (Mac mini host → PS5 browser).
; Launch the game with, for example:
;   -PixelStreamingURL="ws://127.0.0.1:8888" -ResX=1920 -ResY=1080 -ForceRes
; (Pair -ResX/-ResY with -ForceRes so the backbuffer matches stream resolution.)
[SystemSettings]
PixelStreaming.WebRTC.MaxFps=60
PixelStreaming.WebRTC.DegradationPreference=MAINTAIN_FRAMERATE

