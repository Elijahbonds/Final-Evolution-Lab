; Merge into Config/DefaultGame.ini (FinalEvolutionLab or your fork).
; Provides:
;   - GeneralProjectSettings: display name, company, copyright, description, ProjectVersion
;   - ProjectPackagingSettings: Development cook, pak, IoStore, English (en) only

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=FELArenaLab
CompanyName=Final Evolution Lab
CopyrightNotice=Copyright Final Evolution Lab. Internal / test build.
Homepage=
Description=Final Evolution Lab — Unreal Arena / Gaming Labs basketball prototype (readiness snapshot + session export). Not the standalone App Store app.
ProjectVersion=1.0-gold-master

[/Script/UnrealEd.ProjectPackagingSettings]
; Gold Master tri-platform (merge with CONFIG_DefaultEngine_FEL.ini; requires SDKs per target).
+TargetPlatforms=IOS
+TargetPlatforms=Mac
+TargetPlatforms=PS5
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=True
UsePakFile=True
bUseIoStore=True
InternationalizationPreset=English
+CulturesToStage=en
bCompressed=True
bRetainStagedDirectory=False
; Gold Master — cook paths must match **asset** names in Content (see FELDigitalTwinVenuePaths.h). Default: Venues/VeniceBeach + Venues/Dojo.
+MapsToCook=(FilePath="/Game/FEL/Venues/VeniceBeach")
+MapsToCook=(FilePath="/Game/FEL/Venues/Dojo")
; OpenLevel (FELDigitalTwinVenuePaths::LumaVeniceShop): /Game/FEL/Venues/Luma_Venice_Shop.Luma_Venice_Shop — list both cook paths to reduce pruning black screens.
+MapsToCook=(FilePath="/Game/FEL/Venues/Luma_Venice_Shop")
+MapsToCook=(FilePath="/Game/FEL/Venues/Luma_Venice_Shop/Luma_Venice_Shop")
; Optional legacy Luma shell (only if present in Content): +MapsToCook=(FilePath="/Game/FEL/Maps/L_SovereignShop_Luma")
; Extreme Scalability — Sovereign gear max texture cook targets (verified by scripts/package_gold_master.sh report):
; FEL_VERIFY_SOVEREIGN_GEAR_TEXTURE_PX_IOS_ASTC=1024

; ps5_preflight_check.sh + package_gold_master.sh — Sovereign gear max dimension (PS5 BC7 cook target).
[FELPackagingQA]
FEL_VERIFY_SOVEREIGN_GEAR_TEXTURE_PX_PS5_PRO=4096

; Asset Manager — PrimaryAssetLabel bundles per arena (skeletal mesh + Niagara + Luma textures under each label).
; Create UPrimaryAssetLabel assets under /Game/FEL/PrimaryAssetLabels/ with Primary Asset Type = FELVenue.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="FELVenue",AssetBaseClass=/Script/Engine.PrimaryAssetLabel,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/FEL/PrimaryAssetLabels")))
