; -----------------------------------------------------------------------------
; Append to Config/DefaultEngine.ini for native iOS (Metal) — tune after profiling on device.
; Targets high-end iPhones (e.g. 15/16 Pro). Validate CVars against your UE 5.7 build.
; -----------------------------------------------------------------------------

[ConsoleVariables]
; Texture streaming pool (MB) — raise if you see blurry mips; lower if memory-constrained.
r.Streaming.PoolSize=1024
; Metal-friendly mobile defaults; adjust per project (Lumen/Nanite off for many mobile titles).
r.MobileHDR=1

[/Script/Engine.RendererSettings]
; Forward-compatible mobile renderer hints — verify in Editor → Project Settings → Platforms → iOS.
r.Mobile.EnableNoPrecomputedLightingCSMShader=1
