; Final Evolution 1.0.0 — Nintendo Switch / Switch Lite scalability
; UE 5.7: clamps texture streaming footprint, disables ray tracing paths, targets 60 FPS with Forward + baked lighting bias (Luma Venice Shop).
; Merged with engine DefaultScalability.ini — keep groups aligned with UFELPlatformManager::ApplySwitchSettings.

[ScalabilitySettings]
; Conservative baseline for 4GB-class VRAM stability
PerfIndexValues_ResolutionQuality="50 50 50 50 100"
PerfIndexValues_ViewDistanceQuality="0 1 1 2 3"
PerfIndexValues_AntiAliasingQuality="0 1 1 2 2"
PerfIndexValues_ShadowQuality="0 1 1 2 2"
PerfIndexValues_GlobalIlluminationQuality="0 0 0 1 1"
PerfIndexValues_ReflectionQuality="0 0 1 1 2"
PerfIndexValues_PostProcessQuality="0 1 1 2 2"
PerfIndexValues_TextureQuality="0 1 1 2 3"
PerfIndexValues_EffectsQuality="0 1 1 2 3"
PerfIndexValues_FoliageQuality="0 0 1 2 2"
PerfIndexValues_ShadingQuality="0 1 1 2 3"

[TextureQuality@0]
; VRAM stability: bias streaming toward lower mips (content pipeline should cap max texture size ~1024 on Switch cooks)
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MipBias=1
r.Streaming.Boost=0.65

[TextureQuality@1]
r.Streaming.MipBias=0.5
r.Streaming.Boost=0.75

[TextureQuality@2]
r.Streaming.MipBias=0.25
r.Streaming.Boost=0.85

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.6

[GlobalIlluminationQuality@0]
; Baked / non-dynamic GI bias for shop shells
r.DynamicGlobalIlluminationMethod=0
r.Lumen.HardwareRayTracing=0

[ReflectionQuality@0]
r.ReflectionMethod=0
r.RayTracing=0

[PostProcessQuality@0]
; Keep bloom / flare readable without RT-heavy paths
r.BloomQuality=1
r.DepthOfFieldQuality=0
r.MotionBlurQuality=0

[SystemSettings]
; Hard-disable RT on Switch cook targets (redundant with platform manager — belt and suspenders)
r.RayTracing=0
