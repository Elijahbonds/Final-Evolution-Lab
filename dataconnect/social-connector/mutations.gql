# Requires signed-in Firebase Auth (including anonymous). Sensitive writes resolve the SQL User row via firebaseUid == auth.uid (no client-supplied peer IDs).

mutation RegisterSignedInUser(
  $username: String!
  $email: String!
  $profilePictureUrl: String
  $avatarUrl: String
) @auth(level: USER_ANON) {
  user_insert(
    data: {
      firebaseUid_expr: "auth.uid"
      username: $username
      email: $email
      profilePictureUrl: $profilePictureUrl
      avatarUrl: $avatarUrl
    }
  )
}

# Prefer UpdateMyTrainingProfile: authorizes only the signed-in user's row (no client User_Key).
mutation UpdateMyTrainingProfile($topPRQScore: Float!, $avatarUrl: String) @auth(level: USER_ANON) @transaction {
  query
    @check(expr: "response.query.users.size() > 0", message: "No User row for this Firebase account.")
    @redact {
    users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
      id
    }
  }
  user_update(
    key: { id_expr: "response.query.users[0].id" }
    data: { topPRQScore: $topPRQScore, avatarUrl: $avatarUrl }
  )
}

