  }
  post_insert(
    data: {
      content: $content
      authorId_expr: "response.query.users[0].id"
      gameModeId: $gameModeId
      trainingScore: $trainingScore
      clipUrl: $clipUrl
      feedSource: $feedSource
    }
  )
}

