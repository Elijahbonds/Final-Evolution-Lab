mutation DeletePost($postId: UUID!) @auth(level: USER_ANON) @transaction {
  query
    @check(expr: "response.query.users.size() > 0 && response.query.posts.size() > 0 && response.query.posts[0].author.id == response.query.users[0].id", message: "Post not found or not authorized.")
    @redact {
    users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
      id
    }
    posts(where: { id: { eq: $postId } }, limit: 1) {
      id
      author {
        id
      }
    }
  }
  post_delete(key: { id_expr: "response.query.posts[0].id" })
}

mutation DeleteComment($commentId: UUID!) @auth(level: USER_ANON) @transaction {
  query
    @check(expr: "response.query.users.size() > 0 && response.query.comments.size() > 0 && response.query.comments[0].author.id == response.query.users[0].id", message: "Comment not found or not authorized.")
    @redact {
    users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
      id
    }
    comments(where: { id: { eq: $commentId } }, limit: 1) {
      id
      author {
        id
      }
    }
  }
  comment_delete(key: { id_expr: "response.query.comments[0].id" })
}

# Client-callable shard **spend** only (negative delta). `reason` is allowlisted so arbitrary spend labels cannot drain balance.
# Allowed: `creator_card_purchase` (paired with ClaimCreatorCardOwnership), `shard_shop` (catalog cosmetics — ownership remains client-local until server inventory exists).
# Positive grants use admin `AppendShardLedger` after verified sessions.
mutation SpendEvolutionShards($deltaShards: Int!, $reason: String!, $referenceId: String) @auth(level: USER_ANON) @transaction {
  query
    @check(expr: "response.query.users.size() > 0 && vars.deltaShards < 0 && vars.deltaShards >= -10000000 && response.query.users[0].evolutionShards + vars.deltaShards >= 0 && response.query.priorGrants.size() == 0 && (vars.reason == 'creator_card_purchase' || vars.reason == 'shard_shop')", message: "Invalid shard spend, insufficient balance, duplicate, or disallowed reason.")
    @redact {
    users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
      id
      evolutionShards
    }
    priorGrants: shardLedgers(
      where: {
        user: { firebaseUid: { eq_expr: "auth.uid" } }
        reason: { eq: $reason }
        referenceId: { eq: $referenceId }
      }
      limit: 1
    ) {
      id
    }
  }
  shardLedger_insert(
    data: {
      userId_expr: "response.query.users[0].id"
      deltaShards: $deltaShards
      reason: $reason
      referenceId: $referenceId
      dedupeKey_expr: "auth.uid + '|' + vars.reason + '|' + (vars.referenceId != null ? vars.referenceId : '')"
    }
  )
  user_update(
    key: { id_expr: "response.query.users[0].id" }
    data: { evolutionShards_update: { inc: $deltaShards } }
  )
}

# Call after a successful `SpendEvolutionShards` with reason `creator_card_purchase` and the same `catalogCardId` as ledger `referenceId`.
mutation ClaimCreatorCardOwnership($catalogCardId: String!) @auth(level: USER_ANON) @transaction {
  query
    @check(expr: "response.query.users.size() > 0 && response.query.proofSpend.size() > 0 && response.query.proofSpend[0].deltaShards < 0 && response.query.catalogHits.size() > 0 && response.query.existingOwn.size() == 0", message: "Cannot claim ownership.")
    @redact {
    users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
      id
    }
    proofSpend: shardLedgers(
      where: {
        user: { firebaseUid: { eq_expr: "auth.uid" } }
        reason: { eq: "creator_card_purchase" }
        referenceId: { eq: $catalogCardId }
      }
      limit: 1
    ) {
      id
      deltaShards
    }
    catalogHits: creatorCards(where: { catalogCardId: { eq: $catalogCardId } }, limit: 1) {
      id
      catalogCardId
    }
    existingOwn: userOwnedCreatorCards(
      where: {
        user: { firebaseUid: { eq_expr: "auth.uid" } }
        creatorCard: { catalogCardId: { eq: $catalogCardId } }
      }
      limit: 1
    ) {
      user {
        id
      }
    }
  }
  userOwnedCreatorCard_insert(
    data: {
      userId_expr: "response.query.users[0].id"
      creatorCardId_expr: "response.query.catalogHits[0].id"
    }
  )
}

# Atomic: escrow 500 shards + row (reason `critique_escrow` — not exposed on generic SpendEvolutionShards).
mutation CreateCritiqueRequestWithEscrow($requestKey: String!, $exerciseName: String!, $notes: String) @auth(level: USER_ANON) @transaction {
  query
    @check(expr: "response.query.users.size() > 0 && vars.requestKey.size() > 0 && vars.requestKey.size() <= 40 && response.query.users[0].evolutionShards >= 500 && response.query.priorLedger.size() == 0 && response.query.duplicateCritique.size() == 0", message: "Cannot create critique request.")
    @redact {
    users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
      id
      evolutionShards
    }
    priorLedger: shardLedgers(
      where: {
        user: { firebaseUid: { eq_expr: "auth.uid" } }
        reason: { eq: "critique_escrow" }
        referenceId: { eq: $requestKey }
      }
      limit: 1
    ) {
      id
    }
    duplicateCritique: coachCritiqueRequests(where: { requestKey: { eq: $requestKey } }, limit: 1) {
      requestKey
    }
  }
  shardLedger_insert(
    data: {
      userId_expr: "response.query.users[0].id"
      deltaShards: -500
      reason: "critique_escrow"
      referenceId: $requestKey
      dedupeKey_expr: "auth.uid + '|' + 'critique_escrow' + '|' + vars.requestKey"
    }
  )
  user_update(
    key: { id_expr: "response.query.users[0].id" }
    data: { evolutionShards_update: { inc: -500 } }
  )
  coachCritiqueRequest_insert(
    data: {
      requestKey: $requestKey
      exerciseName: $exerciseName
      notes: $notes
      shardsEscrowed: 500
      status: "pending"
      userId_expr: "response.query.users[0].id"
    }
  )
}

# Requires catalog row, ownership row, sane price, no duplicate active listing per seller+card.
mutation CreateCardMarketListing($catalogCardId: String!, $priceShards: Int!) @auth(level: USER_ANON) @transaction {
  query
    @check(expr: "response.query.users.size() > 0 && response.query.catalogHits.size() > 0 && response.query.ownershipHits.size() > 0 && vars.priceShards > 0 && vars.priceShards <= 100000000 && response.query.duplicateActiveListings.size() == 0", message: "Invalid listing or you do not own this card in Cloud SQL.")
    @redact {
    users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
      id
    }
    catalogHits: creatorCards(where: { catalogCardId: { eq: $catalogCardId } }, limit: 1) {
      id
      catalogCardId
    }
    ownershipHits: userOwnedCreatorCards(
      where: {
        user: { firebaseUid: { eq_expr: "auth.uid" } }
        creatorCard: { catalogCardId: { eq: $catalogCardId } }
      }
      limit: 1
    ) {
      user {
        id
      }
    }
    duplicateActiveListings: cardMarketListings(
      where: {
        seller: { firebaseUid: { eq_expr: "auth.uid" } }
        catalogCardId: { eq: $catalogCardId }
        active: { eq: true }
      }
      limit: 1
    ) {
      id
    }
  }
  cardMarketListing_insert(
    data: {
      sellerId_expr: "response.query.users[0].id"
      catalogCardId: $catalogCardId
      priceShards: $priceShards
      active: true
    }
  )
}

mutation DeactivateCardMarketListing($listingId: UUID!) @auth(level: USER_ANON) @transaction {
  query
    @check(expr: "response.query.users.size() > 0 && response.query.cardMarketListings.size() > 0 && response.query.cardMarketListings[0].seller.id == response.query.users[0].id", message: "Listing not found or not authorized.")
    @redact {
    users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
      id
    }
    cardMarketListings(where: { id: { eq: $listingId } }, limit: 1) {
      id
      seller {
        id
      }
    }
  }
  cardMarketListing_update(key: { id_expr: "response.query.cardMarketListings[0].id" }, data: { active: false })
}
