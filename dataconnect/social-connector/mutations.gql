# Requires Firebase Auth (Anonymous or full account). Tighten with @auth(expr: ...) as you mature IAM.

mutation RegisterSignedInUser(
  $username: String!
  $email: String!
  $profilePictureUrl: String
  $avatarUrl: String
) @auth(level: USER) {
  user_insert(
    data: {
      firebaseUid_expr: "auth.uid"
      username: $username
      email: $email
      profilePictureUrl: $profilePictureUrl
      avatarUrl: $avatarUrl
    }
  )
}

mutation LinkUserToFirebaseAuth($userKey: User_Key!) @auth(level: USER) {
  user_update(key: $userKey, data: { firebaseUid_expr: "auth.uid" })
}

mutation UpdateUserTrainingProfile(
  $userKey: User_Key!
  $topPRQScore: Float!
  $avatarUrl: String
) @auth(level: USER) {
  user_update(
    key: $userKey
    data: { topPRQScore: $topPRQScore, avatarUrl: $avatarUrl }
  )
}

mutation CreatePost(
  $content: String!
  $authorId: UUID!
  $gameModeId: String
  $trainingScore: Float
  $clipUrl: String
  $feedSource: String
) @auth(level: USER) {
  post_insert(
    data: {
      content: $content
      authorId: $authorId
      gameModeId: $gameModeId
      trainingScore: $trainingScore
      clipUrl: $clipUrl
      feedSource: $feedSource
    }
  )
}

mutation CreateComment($postId: UUID!, $authorId: UUID!, $content: String!) @auth(level: USER) {
  comment_insert(
    data: {
      postId: $postId
      authorId: $authorId
      content: $content
    }
  )
}

mutation LikePost($postId: UUID!, $userId: UUID!) @auth(level: USER) {
  postLike_insert(
    data: {
      postId: $postId
      userId: $userId
    }
  )
}

mutation UnlikePost($postId: UUID!, $userId: UUID!) @auth(level: USER) {
  postLike_delete(key: { postId: $postId, userId: $userId })
}

mutation DeletePost($postKey: Post_Key!) @auth(level: USER) {
  post_delete(key: $postKey)
}

mutation DeleteComment($commentKey: Comment_Key!) @auth(level: USER) {
  comment_delete(key: $commentKey)
}

mutation AppendShardLedger(
  $userId: UUID!
  $deltaShards: Int!
  $balanceAfter: Int!
  $source: String!
  $sessionReceiptId: String
  $gameModeId: String
  $note: String
) @auth(level: USER) {
  shardLedger_insert(
    data: {
      userId: $userId
      deltaShards: $deltaShards
      balanceAfter: $balanceAfter
      source: $source
      sessionReceiptId: $sessionReceiptId
      gameModeId: $gameModeId
      note: $note
    }
  )
}

mutation SpendEvolutionShards(
  $userId: UUID!
  $deltaShards: Int!
  $balanceAfter: Int!
  $source: String!
  $note: String
) @auth(level: USER) {
  shardLedger_insert(
    data: {
      userId: $userId
      deltaShards: $deltaShards
      balanceAfter: $balanceAfter
      source: $source
      note: $note
    }
  )
}

mutation CreateArenaSession(
  $player1Id: UUID!
  $player2Id: UUID!
  $entryTier: String!
  $entryShardsEach: Int!
) @auth(level: USER) {
  arenaSession_insert(
    data: {
      player1Id: $player1Id
      player2Id: $player2Id
      entryTier: $entryTier
      entryShardsEach: $entryShardsEach
      status: "battle"
    }
  )
}

mutation UpdateArenaSessionResult(
  $sessionKey: ArenaSession_Key!
  $player1MaxHeightInches: Float!
  $player2MaxHeightInches: Float!
  $player1JumpCount: Int!
  $player2JumpCount: Int!
  $winnerId: UUID
  $shardsAwarded: Int!
  $endedAt: Timestamp!
) @auth(level: USER) {
  arenaSession_update(
    key: $sessionKey
    data: {
      player1MaxHeightInches: $player1MaxHeightInches
      player2MaxHeightInches: $player2MaxHeightInches
      player1JumpCount: $player1JumpCount
      player2JumpCount: $player2JumpCount
      winnerId: $winnerId
      shardsAwarded: $shardsAwarded
      status: "result"
      endedAt: $endedAt
    }
  )
}
