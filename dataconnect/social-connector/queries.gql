# All operations require a signed-in Firebase user (including Anonymous Auth).
# USER_ANON allows anonymous sessions as well as upgraded accounts.

query ListRecentPosts @auth(level: USER_ANON) {
  posts(orderBy: [{ createdAt: DESC }], limit: 50) {
    id
    content
    createdAt
    gameModeId
    trainingScore
    clipUrl
    feedSource
    author {
      id
      username
      profilePictureUrl
      avatarUrl
      topPRQScore
    }
  }
}

query GetPostWithThread($postKey: Post_Key!) @auth(level: USER_ANON) {
  post(key: $postKey) {
    id
    content
    createdAt
    gameModeId
    trainingScore
    clipUrl
    feedSource
    author {
      id
      username
      profilePictureUrl
      avatarUrl
      topPRQScore
    }
    comments_on_post(orderBy: [{ createdAt: ASC }]) {
      id
      content
      createdAt
      author {
        id
        username
        profilePictureUrl
        avatarUrl
      }
    }
    postLikes_on_post {
      createdAt
      user {
        id
        username
      }
    }
  }
}

# Signed-in caller only: resolves row where User.firebaseUid == auth.uid (no client-supplied UID).
query GetUserByFirebaseUid @auth(level: USER_ANON) {
  users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
    id
    username
    profilePictureUrl
    avatarUrl
    topPRQScore
    evolutionShards
    firebaseUid
  }
}

# Email + full account fields for the signed-in user only (private profile / settings).
query GetMyPrivateProfile @auth(level: USER_ANON) {
  users(where: { firebaseUid: { eq_expr: "auth.uid" } }, limit: 1) {
    id
    username
    email
    profilePictureUrl
    avatarUrl
    topPRQScore
    evolutionShards
    firebaseUid
  }
}

query GetUserProfile($userId: UUID!) @auth(level: USER_ANON) {
  user(key: { id: $userId }) {
    id
    username
    profilePictureUrl
    avatarUrl
    topPRQScore
    evolutionShards
  }
  posts(
    where: { author: { id: { eq: $userId } } }
    orderBy: [{ createdAt: DESC }]
    limit: 30
  ) {
    id
    content
    createdAt
    gameModeId
    trainingScore
    feedSource
  }
}

query ListCommentsForPost($postId: UUID!) @auth(level: USER_ANON) {
  comments(where: { post: { id: { eq: $postId } } }, orderBy: [{ createdAt: ASC }]) {
    id
    content
    createdAt
    author {
      id
      username
      profilePictureUrl
      avatarUrl
    }
  }
}

# Ledger for auth.uid only (cannot pass another user's SQL id).
query ListShardLedgerForUser($limit: Int) @auth(level: USER_ANON) {
  shardLedgers(
    where: { user: { firebaseUid: { eq_expr: "auth.uid" } } }
    orderBy: [{ createdAt: DESC }]
    limit: $limit
  ) {
    id
    deltaShards
    reason
    referenceId
    createdAt
  }
}

query ListCreatorCards($limit: Int) @auth(level: USER_ANON) {
  creatorCards(orderBy: [{ displayName: ASC }], limit: $limit) {
    id
    catalogCardId
    displayName
    rarityTier
    createdAt
  }
}

query ListActiveCardMarketListings($limit: Int) @auth(level: USER_ANON) {
  cardMarketListings(where: { active: { eq: true } }, orderBy: [{ listedAt: DESC }], limit: $limit) {
    id
    catalogCardId
    priceShards
    listedAt
    active
    seller {
      id
      username
      avatarUrl
    }
  }
}
