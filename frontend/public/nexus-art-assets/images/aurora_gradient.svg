<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Abstract vertical gradient bands in cyan and violet evoking an aurora.">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050915"/>
      <stop offset="0.45" stop-color="#0a1c3f"/>
      <stop offset="0.7" stop-color="#00D4FF"/>
      <stop offset="0.85" stop-color="#9933FF"/>
      <stop offset="1" stop-color="#1a0630"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.6">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#aurora)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
</svg>
