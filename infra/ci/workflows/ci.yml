name: FEL CI (backend + frontend + match sim)

on:
  push:
    branches: [main, integration/nexus-aaa]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/simulate_matches.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, integration/nexus-aaa]
  workflow_dispatch: {}

jobs:
  backend-tests:
    name: Backend unit tests (MOCK_DB=1)
    runs-on: ubuntu-latest
    env:
      MOCK_DB: '1'
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: ci_fel
      EMERGENT_LLM_KEY: ci-key-unused
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      # requirements-ci.txt is the offline subset of the 130-pin production
      # requirements.txt (LLM SDKs, PayPal, boto3, ... are stubbed by the tests).
      - name: Install backend CI dependencies
        working-directory: backend
        run: pip install -r requirements-ci.txt

      # Only the offline match-lifecycle suite runs here:
      # * other tests/ files are integration tests needing a deployed server
      #   (REACT_APP_BACKEND_URL) and a live database;
      # * tests/test_system_scan.py has 11 pre-existing failures against the
      #   current system_scan router (stale expectations — tracked separately);
      # * --noconftest: tests/conftest.py runs seed_db against a real
      #   PostgreSQL, which CI does not provide. The suite is self-contained.
      - name: Run offline unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          mkdir -p ../artifacts/ci
          pytest tests/test_matches.py --noconftest -v 2>&1 | tee ../artifacts/ci/pytest.log
          exit ${PIPESTATUS[0]}

      - name: Upload pytest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-logs
          path: artifacts/ci/pytest.log

  frontend-build:
    name: Frontend build (Node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps: CRA 5 peer-dependency conflicts (see AGENTS.md).
      - name: Install dependencies (lockfile)
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # CI=false so CRA does not promote lint warnings to build errors.
      - name: Build
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

  sim:
    name: Match simulation (N=3) + replay artifacts
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      MOCK_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install backend CI dependencies
        working-directory: backend
        run: pip install -r requirements-ci.txt

      # Sim harness mounts only the matches router with a header-driven stub
      # identity (no real auth secrets). See backend/tools/sim_server.py.
      - name: Start simulation server
        run: |
          python backend/tools/sim_server.py --port 8811 > artifacts_sim_server.log 2>&1 &
          echo $! > sim_server.pid

      - name: Run 3 simulated matches
        run: |
          python3 scripts/simulate_matches.py --n 3 \
            --base-url http://127.0.0.1:8811 \
            --out artifacts/sim/replays

      - name: Stop simulation server
        if: always()
        run: |
          kill "$(cat sim_server.pid)" 2>/dev/null || true
          mkdir -p artifacts/sim
          cp artifacts_sim_server.log artifacts/sim/server.log || true

      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-replays
          path: artifacts/sim/
