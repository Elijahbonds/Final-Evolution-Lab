; ═══════════════════════════════════════════════════════════════
; Final Evolution Lab — DefaultEngine.ini
; UE 5.7 · Native Mobile (iOS Metal / Android Vulkan)
; Local Sovereign Mode — No Pixel Streaming / No E3DS Cloud GPU
; ═══════════════════════════════════════════════════════════════
; Place in: UnrealStarter/BasketballGame/Config/DefaultEngine.ini
; Validated for native IPA (iOS) and AAB (Android) local builds.
; ═══════════════════════════════════════════════════════════════

; ── Pixel Streaming Safety Net ────────────────────────────────
; Ensures PS2 does NOT auto-start even if plugin is compiled in.
; Once the PixelStreaming plugin is fully excluded from mobile
; targets in .uproject, these lines become no-ops and can be
; removed.
[ConsoleVariables]
PixelStreaming.WebRTC.StartStreaming=0
PixelStreaming2.AutoStartStream=0

; ── Default Maps ──────────────────────────────────────────────
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/FEL/Maps/Venice_Beach_Court
ServerDefaultMap=/Game/FEL/Maps/Venice_Beach_Court

; Game Mode Map Registry (platform-agnostic):
; basketball_h2h/dunk/3v3  → /Game/FEL/Maps/Venice_Beach_Court
; karate_h2h/endless        → /Game/FEL/Maps/Zen_Dojo
; baseball                  → /Game/FEL/Maps/Baseball_Park
; football                  → /Game/FEL/Maps/Gridiron_Stadium
; soccer                    → /Game/FEL/Maps/Soccer_Stadium
; golf                      → /Game/FEL/Maps/Links_Course
; tennis                    → /Game/FEL/Maps/Tennis_Court
; volleyball                → /Game/FEL/Maps/Sand_Court
; gymnastics                → /Game/FEL/Maps/Training_Floor
; surfing                   → /Game/FEL/Maps/Venice_Beach_Surf
; skateboarding             → /Game/FEL/Maps/Skate_Park
; snowboarding              → /Game/FEL/Maps/Mountain_Slope

; ── Game Engine ───────────────────────────────────────────────
[/Script/Engine.GameEngine]
; Allow ServerTravel for deep-link mode switching
bAllowTravel=true

; ── Renderer Settings (Mobile-Optimized) ──────────────────────
[/Script/Engine.RendererSettings]
; Disable desktop-class features that require dedicated GPU
r.Lumen.HardwareRayTracing=0
r.Nanite.Enabled=0
r.RayTracing=0
; Virtual Shadow Maps work well on A15+ / Mali-G710+
r.VirtualShadowMaps.Enable=1
; Anti-aliasing: TSR (method 4) at mobile quality tier
r.AntiAliasingMethod=4
r.TSR.Quality=1
; Forward shading for mobile Metal/Vulkan performance
r.Mobile.ForwardShading=1
; Bloom and post-process at mobile quality
r.BloomQuality=1
r.MotionBlurQuality=0
; Mobile-appropriate shadow quality
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
; Texture streaming for memory management on device
r.Streaming.PoolSize=512

; ── Audio (Local Output — No WebRTC) ──────────────────────────
[Audio]
AudioMixerClassName=/Script/AudioMixerPlatformAudioUnit.AudioMixerPlatformAudioUnit
; Local audio output only — no WebRTC audio streaming
bEnableAudioStreaming=false
