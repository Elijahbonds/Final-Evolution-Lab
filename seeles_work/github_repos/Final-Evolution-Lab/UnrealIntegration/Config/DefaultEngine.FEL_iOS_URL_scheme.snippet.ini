; -----------------------------------------------------------------------------
; Merge into Config/DefaultEngine.ini (iOS section) so iOS registers finalevolution://
; for FELEmergentDeepLinkSubsystem. Also set a real Bundle Identifier in Project Settings → iOS.
;
; Example deep link tested in Safari / FEL shell:
;   finalevolution://launch?map=Zen_Dojo&mode=karate_h2h
;   finalevolution://launch?mode=brain_brawl   → Neuro_Arena
; -----------------------------------------------------------------------------
[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; NOTE: IOSRuntimeSettings only supports a single AdditionalPlistData string.
; Keep all iOS plist additions consolidated here to avoid merge/override issues.
AdditionalPlistData=<key>CFBundleURLTypes</key><array><dict><key>CFBundleTypeRole</key><string>Editor</string><key>CFBundleURLName</key><string>com.finalevolution.lab</string><key>CFBundleURLSchemes</key><array><string>finalevolution</string></array></dict></array><key>NSCameraUsageDescription</key><string>Camera access is used to scan Bio-Fuel meals and training markers for your Final Evolution Lab plan.</string><key>NSHealthShareUsageDescription</key><string>Health access is used to read wellness and performance signals to personalize your readiness and recovery recommendations.</string><key>NSHealthUpdateUsageDescription</key><string>Health access is used to write workout and training session data when you choose to sync results.</string><key>NSBluetoothAlwaysUsageDescription</key><string>Bluetooth access is used to connect compatible training peripherals and controllers.</string>
