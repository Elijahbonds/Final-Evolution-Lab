; -----------------------------------------------------------------------------
; Merge into Config/DefaultEngine.ini (append below existing sections).
; FEL / E3DS production target: H.264 @ 60 fps, ~20 Mbps (NVENC on NVIDIA hosts).
; ps1 (PixelStreaming.*) lines keep fel_ue5_win64_cook_only.sh greps satisfied; ps2 is PS2 plugin.
;
; ueapp04 postMessage hooks live in the **parent page / E3DS iframe shell**, not in this INI — wire per
; Eagle 3D Control Panel docs (commands cross the browser boundary; UE exposes stream + encoder CVars).
; Docs: https://dev.epicgames.com/documentation/unreal-engine/pixel-streaming-2-overview-in-unreal-engine
; -----------------------------------------------------------------------------

[ConsoleVariables]
; --- Pixel Streaming 2 (UE 5.7 plugin) — prefer these when PixelStreaming2 is enabled ---
PixelStreaming2.AutoStartStream=1
PixelStreaming2.Encoder.Codec=H264
; TargetBitrate / WebRTC caps in bps (20 Mbps)
PixelStreaming2.Encoder.TargetBitrate=20000000
PixelStreaming2.WebRTC.Fps=60
PixelStreaming2.WebRTC.MinBitrate=1000000
PixelStreaming2.WebRTC.MaxBitrate=20000000

; --- Legacy Pixel Streaming (plugin v1) — keeps scripts & older hosts compatible ---
PixelStreaming.WebRTC.StartStreaming=1
PixelStreaming.Encoder.Codec=H264
PixelStreaming.Encoder.TargetBitrate=20000000
PixelStreaming.WebRTC.Fps=60
