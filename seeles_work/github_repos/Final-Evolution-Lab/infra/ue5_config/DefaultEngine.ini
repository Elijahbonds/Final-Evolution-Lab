; ═══════════════════════════════════════════════════════════════
; Final Evolution Lab — DefaultEngine.ini
; UE 5.7 Pixel Streaming 2 · Eagle 3D Streaming (E3DS) Compatible
; ═══════════════════════════════════════════════════════════════
; Place in: UnrealStarter/BasketballGame/Config/DefaultEngine.ini
; Validated for E3DS iframe embed + postMessage communication
; ═══════════════════════════════════════════════════════════════

[/Script/PixelStreamingServers.PixelStreamingServers]
; E3DS manages the signalling server externally — disable built-in
bUseInternalSignalling=False

[PixelStreaming]
; ── Core Streaming ──────────────────────────────────────────
AllowPixelStreamingCommands=true
PixelStreamingIP=0.0.0.0
PixelStreamingPort=8888

; ── Encoder (NVENC for E3DS RTX 4080 / RTX 3070) ──────────
Encoder.TargetBitrate=20000000
Encoder.MaxBitrate=30000000
Encoder.MinQP=18
Encoder.MaxQP=36
Encoder.RateControl=CBR
Encoder.KeyframeInterval=300
Encoder.Codec=H264
Encoder.EnableFillerData=true

; ── WebRTC (tuned for E3DS iframe latency) ─────────────────
WebRTC.DisableReceiveAudio=false
WebRTC.DisableTransmitAudio=false
WebRTC.DisableReceiveVideo=false
WebRTC.DisableAudioSync=false
WebRTC.MaxFps=60
WebRTC.StartBitrate=10000000
WebRTC.MinBitrate=5000000
WebRTC.MaxBitrate=30000000

; ── Input (required for E3DS iframe keyboard/mouse pass-through) ──
AllowPixelStreamingInput=true
InputController.SuppressBrowserKeys=false
InputController.FakeTouchEvents=false
InputController.HoveringMouseMode=true

; ── E3DS iframe Communication ──────────────────────────────
; postMessage commands use 'ueapp04' prefix
; ServerTravel commands for game mode switching:
;   {cmd: "ueapp04", value: {ServerTravel: "/Game/FEL/Maps/Venice_Beach_Court"}}
;   {cmd: "ueapp04", value: {Teleport: 1}}  (venue index)
AllowConsoleCommands=true

; ── Resolution & Scaling ───────────────────────────────────
; E3DS streams at native res, downscaled by WebRTC as needed
DefaultRes.X=1920
DefaultRes.Y=1080
MatchViewportRes=true

[PixelStreamingPluginSettings]
bEnabled=true
bAllowPixelStreamingCommands=true

[/Script/PixelStreaming.PixelStreamingSettings]
; Enable Pixel Streaming 2 features (UE 5.7)
bDecoupleFrameRate=true
DecoupledTargetFPS=60
bOverrideMinDesiredFPS=true
MinDesiredFPS=30

; ── E3DS Specific: SFU / Simulcast ────────────────────────
bEnableSimulcast=true
SimulcastParameters=(MaxBitrate=20000000,ScaleResolutionDownBy=1.0),(MaxBitrate=8000000,ScaleResolutionDownBy=2.0),(MaxBitrate=3000000,ScaleResolutionDownBy=4.0)

; ── Idle / Timeout (E3DS manages session lifecycle) ────────
bDisconnectPlayersOnIdle=false
PlayerIdleTimeout=900

[/Script/Engine.GameEngine]
; Allow travel commands from E3DS postMessage
bAllowTravel=true

[/Script/EngineSettings.GameMapsSettings]
; Default map for startup — Venice Beach is the lobby
GameDefaultMap=/Game/FEL/Maps/Venice_Beach_Court
ServerDefaultMap=/Game/FEL/Maps/Venice_Beach_Court

; ── Game Mode Map Registry ─────────────────────────────────
; These maps correspond to E3DS launch-mode API:
; basketball_h2h/dunk/3v3  → /Game/FEL/Maps/Venice_Beach_Court
; karate_h2h/endless        → /Game/FEL/Maps/Zen_Dojo
; baseball                  → /Game/FEL/Maps/Baseball_Park
; football                  → /Game/FEL/Maps/Gridiron_Stadium
; soccer                    → /Game/FEL/Maps/Soccer_Stadium
; golf                      → /Game/FEL/Maps/Links_Course
; tennis                    → /Game/FEL/Maps/Tennis_Court
; volleyball                → /Game/FEL/Maps/Sand_Court
; gymnastics                → /Game/FEL/Maps/Training_Floor
; surfing                   → /Game/FEL/Maps/Venice_Beach_Surf
; skateboarding             → /Game/FEL/Maps/Skate_Park
; snowboarding              → /Game/FEL/Maps/Mountain_Slope

[/Script/Engine.RendererSettings]
; Lumen GI + Nanite (RTX 4080 capable)
r.Lumen.HardwareRayTracing=1
r.Nanite.Enabled=1
r.RayTracing=1
r.VirtualShadowMaps.Enable=1

; ── Anti-aliasing (TSR for streaming quality) ──────────────
r.AntiAliasingMethod=4
r.TSR.Quality=3

[Audio]
; Audio streaming through WebRTC
AudioMixerClassName=/Script/AudioMixerPlatformAudioUnit.AudioMixerPlatformAudioUnit
bEnableAudioStreaming=true
