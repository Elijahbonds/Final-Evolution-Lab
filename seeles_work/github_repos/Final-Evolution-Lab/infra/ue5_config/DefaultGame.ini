; ═══════════════════════════════════════════════════════════════
; Final Evolution Lab — DefaultGame.ini
; UFELBridgeSubsystem Configuration
; Vault Backend Connection · M4 Pro Mac Mini
; ═══════════════════════════════════════════════════════════════
; Full ship defaults live below (bCookAll, MapsToCook, FELPlayMap). Copy this file into your UE
; **Config/DefaultGame.ini** or run ./prepare_fel_full_ship.sh against your project directory.

[FELBridge]
; WebSocket URL — set via FEL_GAME_WS_URL environment variable
; Falls back to this value if env var is not set
GameWebSocketUrl=wss://readiness-stack.preview.emergentagent.com/ws/vault
VaultHubHost=

; Focus-Lock (Gate 4 — prevents E3DS iframe focus-loss)
bFocusKeepalive=True
KeepaliveInterval=0.5

; Vault Sync
bVaultSync=True
VaultTarget=M4ProMacMini
VaultProtocol=WSS
VaultEncryption=AES-256-GCM

; Match Event Forwarding
bForwardMatchScores=True
bForwardReferralEvents=True
bForwardAnalytics=True

[/Script/FinalEvolutionLab.FELFELBridgeSubsystem]
; Bridge subsystem settings
bAutoConnect=True
ReconnectInterval=5.0
MaxReconnectAttempts=10
HeartbeatInterval=1.0

; Event channels
ScoreChannel=match_score
ReferralChannel=referral_event
AnalyticsChannel=analytics_session
KeepaliveChannel=focus_keepalive

; Data format
PayloadFormat=JSON
bEncryptPayloads=True
EncryptionAlgorithm=AES-256-GCM

[/Script/FinalEvolutionLab.FELVenueRegistry]
; Venue registry source
VenueRegistryPath=FEL_VenueRegistry.production.json
bAutoLoadVenues=True
DefaultVenue=Venice_Beach_Court

; -----------------------------------------------------------------------------
; Full native ship — cook all content + stage venue worlds (iOS Shipping / App Store workflow)
; -----------------------------------------------------------------------------
[/Script/UnrealEd.ProjectPackagingSettings]
bCookAll=True
BuildConfiguration=PPBC_Shipping
ForDistribution=True
IncludeDebugFiles=False
FullRebuild=False
UsePakFile=True
bUseIoStore=True
InternationalizationPreset=English
+CulturesToStage=en
bCompressed=True
bRetainStagedDirectory=False
+DirectoriesToAlwaysStageAsNonUFS=(Path="FEL/Data")
+MapsToCook=(FilePath="/Game/FEL/Venues/BaseballPark/BaseballPark")
+MapsToCook=(FilePath="/Game/FEL/Venues/Dojo/Dojo")
+MapsToCook=(FilePath="/Game/FEL/Venues/Gridiron/Gridiron")
+MapsToCook=(FilePath="/Game/FEL/Venues/Links/Links")
+MapsToCook=(FilePath="/Game/FEL/Venues/Luma_Venice_Shop/Luma_Venice_Shop")
+MapsToCook=(FilePath="/Game/FEL/Venues/NeuroArena/NeuroArena")
+MapsToCook=(FilePath="/Game/FEL/Venues/SandCourt/SandCourt")
+MapsToCook=(FilePath="/Game/FEL/Venues/SoccerStadium/SoccerStadium")
+MapsToCook=(FilePath="/Game/FEL/Venues/TennisCourt/TennisCourt")
+MapsToCook=(FilePath="/Game/FEL/Venues/TrainingFloor/TrainingFloor")
+MapsToCook=(FilePath="/Game/FEL/Venues/VeniceBeach/VeniceBeach")
bShareMaterialShaderCode=False

[FELPlayMap]
basketball_h2h=/Game/FEL/Venues/VeniceBeach/VeniceBeach
basketball_dunk=/Game/FEL/Venues/VeniceBeach/VeniceBeach
basketball_3v3=/Game/FEL/Venues/VeniceBeach/VeniceBeach
karate_h2h=/Game/FEL/Venues/Dojo/Dojo
karate_endless=/Game/FEL/Venues/Dojo/Dojo
karate=/Game/FEL/Venues/Dojo/Dojo
baseball=/Game/FEL/Venues/BaseballPark/BaseballPark
football=/Game/FEL/Venues/Gridiron/Gridiron
soccer=/Game/FEL/Venues/SoccerStadium/SoccerStadium
golf=/Game/FEL/Venues/Links/Links
tennis=/Game/FEL/Venues/TennisCourt/TennisCourt
volleyball=/Game/FEL/Venues/SandCourt/SandCourt
gymnastics=/Game/FEL/Venues/TrainingFloor/TrainingFloor
surfing=/Game/FEL/Venues/VeniceBeach/VeniceBeach
skateboarding=/Game/FEL/Venues/VeniceBeach/VeniceBeach
snowboarding=/Game/FEL/Venues/VeniceBeach/VeniceBeach
brain_brawl=/Game/FEL/Venues/NeuroArena/NeuroArena
market_browse=/Game/FEL/Venues/Luma_Venice_Shop/Luma_Venice_Shop

[FELHubDiscovery]
bProbeCandidateHosts=True
; Disabled by default: full /24 scans can stall startup on iOS.
bScanLocalSubnet=False
CandidateLanHosts=
DiscoveryPort=0

[FELFeaturedMode]
FeaturedArenaModeId=basketball_dunk

[Staging]
+AllowedConfigFiles=FinalEvolutionLab/Config/IOS/DefaultGame.ini
+AllowedConfigFiles=FinalEvolutionLab/Config/IOS/DefaultEngine.ini
