[build]
  command = "npm run build"
  publish = "dist"

# Hashed bundles — long cache; HTML stays fresh via short cache at CDN edge patterns
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# macOS installer — short URL, high-speed 302 to Supabase Storage (.dmg)
[[redirects]]
  from = "/download/final-evolution"
  to = "https://rlqkschgvlrva-wsdzjxq.supabase.co/storage/v1/object/public/sovereign-assets/mac/SovereignLab_1.0_Gold.dmg"
  status = 302

# iOS OTA — static page triggers itms-services:// (mirrors public/_redirects)
[[redirects]]
  from = "/download/ios"
  to = "/download/ios/index.html"
  status = 200

[[redirects]]
  from = "/download/ios/"
  to = "/download/ios/index.html"
  status = 200

# Correct MIME for Apple wireless manifest (Safari / installd)
[[headers]]
  for = "/download/ios/manifest.plist"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Deep links — explicit before SPA catch-all (alpha: /play, /lab never 404)
[[redirects]]
  from = "/play"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/play/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/lab"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/lab/*"
  to = "/index.html"
  status = 200

# SPA — must follow specific redirects (Netlify evaluates in file order; mirrors public/_redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
