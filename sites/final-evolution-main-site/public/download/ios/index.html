<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />
    <title>Install Sovereign Lab</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020203;
        color: rgba(255, 255, 255, 0.88);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #5ce1e6;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.95rem;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.55);
        max-width: 22rem;
      }
      a.install {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 1.75rem;
        border-radius: 999px;
        background: #5ce1e6;
        color: #020203;
        font-weight: 800;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        box-shadow: 0 0 28px rgba(92, 225, 230, 0.35);
      }
      a.install:active {
        opacity: 0.92;
      }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.35);
        max-width: 20rem;
      }
    </style>
    <script>
      (function () {
        var manifest =
          "https://finalevolutiongroup.com/download/ios/manifest.plist";
        var installURL =
          "itms-services://?action=download-manifest&url=" +
          encodeURIComponent(manifest);
        function go() {
          window.location.replace(installURL);
        }
        document.addEventListener("DOMContentLoaded", function () {
          var link = document.getElementById("install-link");
          if (link) link.setAttribute("href", installURL);
          setTimeout(go, 120);
        });
      })();
    </script>
  </head>
  <body>
    <h1>Sovereign Lab</h1>
    <p>
      Opening the iOS installer. If nothing happens, tap Install below (Safari
      works best).
    </p>
    <a class="install" id="install-link" href="#">Install Sovereign Lab</a>
    <p class="hint">
      Ad Hoc or Enterprise distribution only. Device must be allowed on the
      provisioning profile. Use HTTPS on your real domain.
    </p>
  </body>
</html>
